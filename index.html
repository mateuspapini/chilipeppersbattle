<style>
/* Layout: cartaz de show — faixa de topo, palco central com duelo lado a lado, listas numeradas como setlist */
:root{
  --bg:#F6EEE9; --surface:#FFFFFF; --surface-2:#F0E3DC; --fg:#1E1415; --muted:#6E5B58; --line:#E2D1C9;
  --chili:#D7261E; --chili-ink:#FFFFFF; --sea:#0E7C86; --sun:#F2B134;
  --love:#D7261E; --like:#E58A1F; --meh:#8C7C78; --unk:#5B6B8C;
  --display:"Bowlby One", "Arial Black", Impact, sans-serif;
  --body:"Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --shadow:0 10px 30px rgba(80,20,20,.12);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150E10; --surface:#22181A; --surface-2:#2C2023; --fg:#F5E9E4; --muted:#B9A7A2; --line:#3A2B2E;
  --chili:#FF4A3D; --chili-ink:#1A0D0E; --sea:#39C2CC; --sun:#F6C25A;
  --love:#FF4A3D; --like:#F5A043; --meh:#A89894; --unk:#8EA0C8; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150E10; --surface:#22181A; --surface-2:#2C2023; --fg:#F5E9E4; --muted:#B9A7A2; --line:#3A2B2E;
  --chili:#FF4A3D; --chili-ink:#1A0D0E; --sea:#39C2CC; --sun:#F6C25A;
  --love:#FF4A3D; --like:#F5A043; --meh:#A89894; --unk:#8EA0C8; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.05;text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--fg)}
.top .wrap{display:flex;align-items:center;gap:12px 16px;padding-block:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:20px;letter-spacing:.01em;margin-right:auto;background:none;border:0;color:var(--fg);padding:0;text-align:left}
.brand span{color:var(--chili)}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{border:2px solid var(--fg);background:transparent;color:var(--fg);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
nav button[aria-current="true"]{background:var(--fg);color:var(--bg)}
.lang{display:inline-flex;gap:4px;align-items:center}
.lang button{border:0;background:transparent;padding:3px;border-radius:50%;line-height:0;opacity:.5;filter:saturate(.6);transition:opacity .15s,transform .15s,filter .15s}
.lang button img{width:32px;height:32px;display:block}
.lang button:hover{opacity:.9;filter:none;transform:scale(1.08)}
.lang button[aria-pressed="true"]{opacity:1;filter:none;transform:scale(1.12)}

/* hero */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center;padding-block:40px 24px}
.hero h1{font-size:clamp(40px,7vw,76px)}
.hero h1 em{font-style:normal;color:var(--chili)}
.hero p{max-width:52ch;color:var(--muted);font-size:17px;margin:16px 0 0}
.stack{position:relative;height:260px}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:8px}
.mode{background:var(--surface);border:2px solid var(--fg);border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:10px;text-align:left;color:var(--fg)}
.mode h3{font-size:26px}
.mode p{margin:0;color:var(--muted)}
.mode .go{margin-top:auto;font-weight:700;color:var(--chili)}
.mode:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:40px 0 16px;flex-wrap:wrap}
.section-title h2{font-size:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}
.album-mini{display:flex;flex-direction:column;gap:6px}
.album-mini .name{font-weight:600;line-height:1.25}
.album-mini a.name{color:var(--fg);text-decoration:none}
.album-mini a.name:hover{color:var(--chili);text-decoration:underline}
.album-mini .meta{font-family:var(--mono);font-size:12px;color:var(--muted)}

/* capas tipográficas */
.tile{aspect-ratio:1;max-width:100%;border-radius:4px;position:relative;overflow:hidden;color:#fff;isolation:isolate}
.tile .yr{position:absolute;right:8%;bottom:6%;font-family:var(--display);font-size:clamp(22px,22%,60px);line-height:1}
.tile .tt{position:absolute;left:8%;top:7%;right:8%;font-family:var(--body);font-weight:700;font-size:12px;line-height:1.15;letter-spacing:.04em;text-transform:uppercase}
.tile.lg .tt{font-size:16px}
.tile.lg .yr{font-size:64px}
.tile::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 20% 0%,rgba(255,255,255,.18),transparent 60%);pointer-events:none}
.tile .stamp{position:absolute;left:8%;bottom:8%;width:30%;aspect-ratio:1;border-radius:50%;background:#1A1112;color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:clamp(10px,40%,26px);line-height:1;border:2px solid currentColor}

/* duelo */
.stage{padding-block:28px}
.stage-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.stage-head h2{font-size:clamp(28px,4vw,40px)}
.progress{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin:10px 0 4px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--chili),var(--sun));width:0;transition:width .3s}
.ptext{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.duel{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:18px;align-items:stretch}
.fighter{background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;color:var(--fg);transition:transform .12s,border-color .12s}
.fighter:hover{border-color:var(--chili);transform:translateY(-3px)}
.fighter .pick{background:var(--chili);color:var(--chili-ink);border:0;border-radius:6px;padding:12px;font-weight:700;font-size:16px;margin-top:auto}
.fighter h3{font-family:var(--body);font-weight:700;font-size:22px;line-height:1.2}
.fighter .sub{color:var(--muted);font-size:14px;margin-top:-6px}
.fighter .tile{width:100%}
.song-fighter .tile{width:96px;flex:none}
.song-fighter .row{display:flex;gap:14px;align-items:center}
.vs{align-self:center;font-family:var(--display);font-size:34px;color:var(--chili);transform:rotate(-8deg)}
.listen{display:flex;gap:6px;flex-wrap:wrap}
.listen{align-items:center}
.ico{width:32px;height:32px;border-radius:50%;background:#FFFFFF;border:1.5px solid var(--line);display:inline-grid;place-items:center;flex:none;transition:transform .12s,border-color .12s;text-decoration:none}
.ico img{width:18px;height:18px;object-fit:contain;display:block}
a.ico:hover,.wiki:hover .ico{transform:scale(1.1);border-color:var(--sea)}
.wiki{display:inline-flex;align-items:center;gap:8px;color:var(--fg);font-weight:600;font-size:13px;text-decoration:none}
.wiki .ico img{width:22px;height:22px}
.wiki:hover span:last-child{text-decoration:underline}
.duel-actions{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{border:2px solid var(--fg);background:transparent;color:var(--fg);border-radius:999px;padding:8px 18px;font-weight:600;text-decoration:none;display:inline-block}
.btn.solid{background:var(--fg);color:var(--bg)}
.btn.hot{background:var(--chili);border-color:var(--chili);color:var(--chili-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.keys{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
.la{font-size:12px;font-weight:600;color:var(--sea);text-decoration:none}
.la:hover{text-decoration:underline}

/* triagem */
.triage{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;align-items:center;background:var(--surface);border:2px solid var(--fg);border-radius:10px;padding:24px}
.triage .tile{width:100%}
.triage h3{font-family:var(--body);font-weight:700;font-size:clamp(26px,4vw,38px);line-height:1.1}
.triage .sub{color:var(--muted);margin:6px 0 14px}
.rates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:20px}
.rate{border:2px solid currentColor;background:transparent;border-radius:8px;padding:12px 6px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.rate small{font-family:var(--mono);font-weight:500;font-size:11px;opacity:.75}
.rate.love{color:var(--love)} .rate.like{color:var(--like)} .rate.meh{color:var(--meh)} .rate.unk{color:var(--unk)}
.rate:hover{background:var(--surface-2)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .dot{width:10px;height:10px;border-radius:50%}
.counts{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.count{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 14px;min-width:110px}
.count b{display:block;font-family:var(--display);font-size:28px;font-weight:400;font-variant-numeric:tabular-nums}
.count span{font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:2px solid var(--fg);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:16px}
.panel p{margin:0;color:var(--muted);max-width:60ch}
.seg{display:inline-flex;border:2px solid var(--fg);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--fg);padding:8px 18px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:disabled{opacity:.35;cursor:not-allowed}

/* setlist */
.setlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.setlist li{display:grid;grid-template-columns:48px 56px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px 12px}
.setlist li:nth-child(-n+3){border-color:var(--chili)}
.setlist .pos{font-family:var(--display);font-size:26px;color:var(--chili);text-align:center;font-variant-numeric:tabular-nums}
.setlist .tile{width:56px}
.setlist .nm{font-weight:700;line-height:1.2}
.setlist .al{font-size:13px;color:var(--muted)}
.mv{display:flex;gap:4px}
.mv button{width:32px;height:32px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:6px;font-weight:700}
.mv button:disabled{opacity:.3}
.empty{border:2px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--muted)}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--sun);padding-left:12px;max-width:70ch}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:20;max-width:calc(100% - 32px);text-align:center}
textarea.copy{position:absolute;left:-9999px}

/* apoio + rodapé */
.support{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:16px;margin-top:48px;align-items:stretch}
.support .intro h2{font-size:30px}
.support .intro p{color:var(--muted);margin:10px 0 0;max-width:42ch}
.give{background:var(--surface);border:2px solid var(--fg);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.give h3{font-family:var(--body);font-weight:700;font-size:20px}
.give p{margin:0;color:var(--muted);font-size:14px}
.qr-box{background:#FFFFFF;border-radius:8px;padding:8px;width:min(180px,100%);border:1.5px solid var(--line);display:block}
.qr-box svg{display:block;width:100%;height:auto}
.qr-cap{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.qr-cap a{color:var(--sea)}
.pix{background:var(--surface-2);border:1.5px dashed var(--line);border-radius:8px;padding:8px 12px;min-width:0;font-size:14px}
.pix-key{font-family:var(--mono);font-size:13px;overflow-wrap:anywhere;user-select:all}
.give-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
footer.site{border-top:2px solid var(--fg);margin-top:56px}
footer.site .wrap{display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:24px}
footer.site p{margin:0;color:var(--muted);font-size:13px;max-width:60ch}
footer.site a{color:var(--fg)}
.mapa{display:inline-flex;align-items:center;gap:10px;background:#0F1B2D;color:#fff;border-radius:999px;padding:8px 14px;text-decoration:none;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.12)}
.mapa img{height:22px;width:auto;display:block}
.mapa-float{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;opacity:.82;box-shadow:0 6px 18px rgba(0,0,0,.25);transition:opacity .15s}
.mapa-float:hover{opacity:1}


/* capas e prévias */
.tile .cv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;display:block}
.tile.has-cover .tt,.tile.has-cover .yr,.tile.has-cover::after{display:none}
.tile .stamp{z-index:2}
.pv{width:32px;height:32px;border-radius:50%;border:0;flex:none;cursor:pointer;display:inline-grid;place-items:center;padding:0;background:conic-gradient(rgba(0,0,0,.32) var(--p,0%), transparent 0), var(--chili);transition:transform .12s}
.pv:hover{transform:scale(1.1)}
.pv span{width:0;height:0;border-style:solid;border-width:7px 0 7px 11px;border-color:transparent transparent transparent var(--chili-ink);margin-left:3px}
.pv.on span{width:10px;height:12px;border:0;margin:0;border-left:3px solid var(--chili-ink);border-right:3px solid var(--chili-ink)}
.pv.loading{opacity:.6;animation:pvpulse 1s infinite}
.pv.off{opacity:.3;cursor:not-allowed}
@keyframes pvpulse{50%{transform:scale(.9)}}
.themed .pv{background:conic-gradient(rgba(0,0,0,.32) var(--p,0%), transparent 0), var(--acc)}
.themed .pv span{border-left-color:var(--acc-ink)}
.themed .pv.on span{border-color:transparent;border-left-color:var(--acc-ink);border-right-color:var(--acc-ink)}

/* logo no topo */
.hero-logo{background:#000;border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.hero-logo img{display:block;width:100%;height:auto}

/* de fã para fã */
.story{margin-top:64px;padding-top:40px;border-top:2px solid var(--fg)}
.story-head h2{font-size:clamp(34px,6vw,60px);margin-top:6px}
.story-head h2{color:var(--chili)}
.story-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,320px);gap:40px;align-items:start;margin-top:28px}
.story-text{max-width:64ch}
.story-text p{margin:0 0 16px;font-size:16.5px;line-height:1.75}
.story-text p.lead{font-size:19px;line-height:1.65}
.story-text p.lead::first-letter{font-family:var(--display);font-size:3.2em;float:left;line-height:.9;margin:4px 10px 0 0;color:var(--chili)}
.story-text p.viva{font-weight:600;color:var(--muted);font-size:15px}
.story-text p.motto{font-family:var(--display);font-size:clamp(22px,3vw,30px);line-height:1.2;color:var(--chili);margin-top:22px}
.sign{font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:20px}
.social{display:flex;flex-direction:column;gap:10px}
.social-links{display:flex;gap:10px 20px;flex-wrap:wrap}
.social-links a{display:inline-flex;align-items:center;gap:8px;color:var(--fg);text-decoration:none;font-size:14px;font-weight:600}
.social-links .ico{width:36px;height:36px}
.social-links .ico img{width:24px;height:24px}
.social-links a:hover .ico{transform:scale(1.1);border-color:var(--sea)}
.social-links a:hover span:last-child{text-decoration:underline}
.story-sub{margin:40px 0 14px;display:flex;align-items:center;gap:12px}
.story-sub::after{content:"";flex:1;height:2px;background:var(--line)}
.yt{margin:0;display:flex;flex-direction:column;gap:8px}
.yt figcaption{font-size:13px;color:var(--fg)}
.yt .dim{color:var(--muted)}
.yt-frame{position:relative;display:block;width:100%;border:0;border-radius:12px;overflow:hidden;background:#0D0809;color:#fff;text-decoration:none}
.yt.wide .yt-frame{aspect-ratio:16/9}
.yt.short .yt-frame{aspect-ratio:9/16;max-height:640px}
.yt-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85;transition:opacity .2s}
a.yt-frame:hover img{opacity:1}
.yt-play{position:absolute;left:50%;top:50%;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;background:var(--chili);box-shadow:0 6px 24px rgba(0,0,0,.4)}
.yt-play::after{content:"";position:absolute;left:29px;top:22px;border-style:solid;border-width:14px 0 14px 22px;border-color:transparent transparent transparent #fff}
.yt-label{position:absolute;left:12px;bottom:10px;font-size:12px;font-weight:600;background:rgba(0,0,0,.55);padding:4px 10px;border-radius:999px}
.yt-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.gallery{columns:4 220px;column-gap:14px}
.ph{display:block;width:100%;margin:0 0 14px;padding:0;border:0;background:none;cursor:zoom-in;break-inside:avoid;text-align:left;color:var(--fg);font:inherit}
.ph img{display:block;width:100%;height:auto;border-radius:10px;transition:transform .2s, box-shadow .2s}
.ph:hover img{transform:translateY(-3px);box-shadow:var(--shadow)}
.ph span{display:block;font-size:12.5px;color:var(--muted);margin-top:6px}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(10,6,7,.92);display:grid;place-items:center;padding:calc(56px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.lightbox figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:min(1000px,100%)}
.lightbox img{max-width:100%;max-height:78vh;border-radius:10px;display:block}
.lightbox figcaption{color:#F5E9E4;font-size:14px;text-align:center}
.lightbox .dim{color:#B9A7A2;margin-left:6px}
.lb-btn{position:fixed;border:0;background:rgba(255,255,255,.12);color:#fff;width:48px;height:48px;border-radius:50%;font-size:28px;line-height:1;display:grid;place-items:center}
.lb-btn:hover{background:rgba(255,255,255,.25)}
.lb-close{top:calc(12px + env(safe-area-inset-top,0px));right:16px}
.lb-prev{left:16px;top:50%;transform:translateY(-50%)}
.lb-next{right:16px;top:50%;transform:translateY(-50%)}

/* página do álbum: cores de cada disco */
.themed{--acc:var(--accL);--acc-ink:var(--inkL)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .themed{--acc:var(--accD);--acc-ink:var(--inkD)}}
:root[data-theme="dark"] .themed{--acc:var(--accD);--acc-ink:var(--inkD)}
.themed .eyebrow.acc,.themed .facts .ord,.themed table.tracks .num,.themed .stat b{color:var(--acc)}
.themed .facts{border-color:var(--acc)}
.themed .stat{border-top:3px solid var(--acc)}
.themed table.tracks th{border-bottom-color:var(--acc)}
.themed table.tracks tbody tr:hover td{background:color-mix(in srgb, var(--acc) 9%, transparent)}
.themed .btn.hot{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.themed .tbl-wrap{border-color:color-mix(in srgb, var(--acc) 35%, var(--line))}
.ap-band{height:150px;border-radius:12px;position:relative;overflow:hidden;margin-bottom:-80px}
.ap-band::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,color-mix(in srgb,var(--bg) 55%,transparent))}
.ap-band-yr{position:absolute;right:20px;top:10px;font-family:var(--display);font-size:clamp(48px,9vw,96px);line-height:1;opacity:.9;z-index:1}
.ap .ap-side{z-index:2}
.ap-main{padding-top:96px}
.sub-note{font-size:12px;color:var(--muted);margin-top:2px}
table.tracks td .listen{justify-content:flex-end;flex-wrap:nowrap}
.album-mini.click{background:none;border:0;padding:0;text-align:left;color:var(--fg);cursor:pointer;font:inherit}
.album-mini.click .tile{transition:transform .15s, box-shadow .15s}
.album-mini.click:hover .tile{transform:translateY(-3px);box-shadow:var(--shadow)}
.album-mini.click:hover .name{color:var(--chili)}
.ap-top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.ap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
.ap-side{display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}
.ap-side .tile{width:100%}
.facts{background:var(--surface);border:2px solid var(--fg);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px}
.facts .ord{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--chili)}
.facts .rel{font-size:18px;line-height:1.3}
.facts .rel b{font-family:var(--display);font-weight:400;font-size:22px;display:block}
.facts dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0;font-size:13px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:600}
.facts h4{margin:0 0 6px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.people{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:13px}
.people b{font-weight:700}
.people span{color:var(--muted)}
.ap-main h1{font-size:clamp(32px,5vw,56px);margin-bottom:8px}
.ap-stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 20px}
.stat{background:var(--surface-2);border-radius:8px;padding:10px 14px;min-width:0}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1.5px solid var(--line);border-radius:10px}
table.tracks{width:100%;border-collapse:collapse;font-size:14px;min-width:420px}
table.tracks th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:10px 12px;border-bottom:2px solid var(--line)}
table.tracks td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tracks tr:last-child td{border-bottom:0}
table.tracks .num, table.tracks .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.tracks th.r{text-align:right}
table.tracks .num{color:var(--muted);width:2.5em}
table.tracks .tt{font-weight:600}
table.tracks .tt a{color:inherit;text-decoration:none}
table.tracks .tt a:hover{color:var(--chili);text-decoration:underline}
table.tracks .plays{font-family:var(--display);font-size:16px}
table.tracks .bar{display:inline-block;height:6px;border-radius:3px;background:var(--chili);vertical-align:middle;margin-right:8px;opacity:.75}
table.tracks .dim{color:var(--muted)}
table.tracks .disc td{background:var(--surface-2);font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

@media (max-width:760px){
  .ap{grid-template-columns:1fr}
  .ap-side{position:static}
  .ap-main{padding-top:0}
  .ap-band{height:110px;margin-bottom:-60px}
  .ap-side .tile{max-width:220px}
  .support{grid-template-columns:1fr}
  .story-top{grid-template-columns:1fr;gap:24px}
  .yt-row{grid-template-columns:1fr}
  .lang button img{width:28px;height:28px}
  .story-top .yt.short{max-width:300px}
  .lb-prev,.lb-next{top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:none}
  .mapa-float{display:none}
  .hero{grid-template-columns:1fr;padding-block:24px 8px}
  .stack{height:200px}
  .modes{grid-template-columns:1fr}
  .duel{grid-template-columns:1fr;gap:10px}
  .vs{justify-self:center;font-size:26px}
  .triage{grid-template-columns:1fr;padding:18px}
  .triage .tile{max-width:180px}
  .rates{grid-template-columns:repeat(2,minmax(0,1fr))}
  .setlist li{grid-template-columns:36px 44px minmax(0,1fr) auto;gap:10px}
  .setlist .tile{width:44px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------- motor de duelos: inserção binária num Top-K ---------- */
function newRanker(ids, K){
  const q = ids.slice(); for(let i=q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]]}
  const r = {ranked:[], queue:q, cur:null, lo:0, hi:0, gate:false, K, comps:0, side:0, total:ids.length};
  advance(r); return r;
}
function advance(r){
  while(r.cur===null && r.queue.length){
    r.cur = r.queue.shift();
    if(r.ranked.length===0){ r.ranked.push(r.cur); r.cur=null; continue; }
    if(r.ranked.length>=r.K){ r.gate=true; }
    else { r.gate=false; r.lo=0; r.hi=r.ranked.length; }
  }
  r.side = Math.random()<.5?0:1;
}
function opponent(r){ return r.gate ? r.ranked[r.ranked.length-1] : r.ranked[Math.floor((r.lo+r.hi)/2)]; }
function answer(r, curWins){
  r.comps++;
  if(r.gate){
    if(!curWins){ r.cur=null; advance(r); return; }
    r.gate=false; r.lo=0; r.hi=r.ranked.length-1;
    if(r.lo===r.hi){ insert(r); }
    return;
  }
  const mid = Math.floor((r.lo+r.hi)/2);
  if(curWins) r.hi=mid; else r.lo=mid+1;
  if(r.lo>=r.hi) insert(r);
}
function insert(r){ r.ranked.splice(r.lo,0,r.cur); if(r.ranked.length>r.K) r.ranked.pop(); r.cur=null; advance(r); }
function done(r){ return r.cur===null && r.queue.length===0; }
function estimate(r){
  let n=r.ranked.length, rem=0;
  const items = r.queue.length + (r.cur?1:0);
  for(let i=0;i<items;i++){
    if(n>=r.K){ rem += 1 + 0.35*Math.ceil(Math.log2(r.K)); }
    else { rem += Math.ceil(Math.log2(n+1)); n++; }
  }
  return Math.round(rem);
}

/* a API do Deezer não aceita chamadas diretas do navegador; o formato JSONP contorna isso */
function jsonp(url){
  return new Promise((res,rej)=>{
    const cb = "dz"+Math.random().toString(36).slice(2), s = document.createElement("script");
    const done = ()=>{ clearTimeout(timer); try{ delete window[cb]; }catch(e){ window[cb]=undefined; } s.remove(); };
    const timer = setTimeout(()=>{ done(); rej(new Error("timeout")); }, 8000);
    window[cb] = d=>{ done(); res(d); };
    s.onerror = ()=>{ done(); rej(new Error("network")); };
    s.src = url + (url.includes("?")?"&":"?") + "output=jsonp&callback=" + cb;
    document.head.appendChild(s);
  });
}
const PREVIEWS = {};
const player = new Audio();
let playingId = null;
function setPlaying(id){
  playingId = id;
  document.querySelectorAll(".pv").forEach(b=>{
    const on = !!id && b.dataset.dz===String(id);
    b.classList.toggle("on", on);
    b.setAttribute("aria-label", on ? t("pv_pause") : t("pv_play"));
    b.title = b.getAttribute("aria-label");
    if(!on) b.style.removeProperty("--p");
  });
}
player.addEventListener("ended", ()=>setPlaying(null));
player.addEventListener("timeupdate", ()=>{
  if(!playingId) return;
  const p = Math.min(100, player.currentTime/(player.duration||30)*100).toFixed(1)+"%";
  document.querySelectorAll(`.pv[data-dz="${playingId}"]`).forEach(b=>b.style.setProperty("--p", p));
});
function stopPreview(){ if(!player.paused) player.pause(); setPlaying(null); }
async function togglePreview(id, btn){
  if(playingId===id && !player.paused){ stopPreview(); return; }
  btn.classList.add("loading");
  try{
    let p = PREVIEWS[id];
    if(!p || Date.now()-p.t > 10*60*1000){
      const d = await jsonp(`https://api.deezer.com/track/${id}`);
      if(!d || !d.preview) throw new Error("no preview");
      p = PREVIEWS[id] = {url:d.preview, t:Date.now()};
    }
    player.src = p.url; await player.play(); setPlaying(id);
  }catch(e){ btn.disabled = true; btn.classList.add("off"); toast(t("pv_fail")); }
  btn.classList.remove("loading");
}
document.addEventListener("click", e=>{
  const b = e.target.closest(".pv"); if(!b) return;
  e.preventDefault(); e.stopPropagation();
  togglePreview(b.dataset.dz, b);
}, true);
/* se o botão da música tocando sumir da tela (troca de duelo ou de página), a prévia para */
new MutationObserver(()=>{
  if(!playingId) return;
  if(!document.querySelector(`.pv[data-dz="${playingId}"]`)) stopPreview(); else setPlaying(playingId);
}).observe(document.querySelector("main"), {childList:true, subtree:true});

function fmtDate(iso){
  if(!iso) return "—";
  const p = iso.split("-").map(Number);
  const loc = LANG==="pt"?"pt-BR":LANG==="es"?"es-ES":"en-US";
  const d = new Date(Date.UTC(p[0], (p[1]||1)-1, p[2]||1));
  const opt = p.length===1 ? {year:"numeric"} : p.length===2 ? {month:"long",year:"numeric"} : {day:"numeric",month:"long",year:"numeric"};
  return new Intl.DateTimeFormat(loc, {...opt, timeZone:"UTC"}).format(d);
}

/* cores do disco ajustadas para ter contraste nos dois temas */
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16,(n>>8)&255,n&255]; }
function lum(c){ const f=v=>{v/=255; return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}; return .2126*f(c[0])+.7152*f(c[1])+.0722*f(c[2]); }
function contrast(a,b){ const A=lum(a),B=lum(b); return (Math.max(A,B)+.05)/(Math.min(A,B)+.05); }
function toHex(c){ return "#"+c.map(v=>Math.round(v).toString(16).padStart(2,"0")).join(""); }
function fitColor(hex,bg,min){
  const base=hexRgb(hex), B=hexRgb(bg), target = lum(B)>.4?[0,0,0]:[255,255,255];
  let c=base, k=0;
  while(contrast(c,B)<min && k<1){ k+=.06; c=base.map((v,i)=>v+(target[i]-v)*k); }
  return toHex(c);
}
function inkOn(hex){ const c=hexRgb(hex); return contrast(c,[255,255,255])>=contrast(c,[20,12,14]) ? "#FFFFFF" : "#140C0E"; }
function albumTheme(a){
  const sat = h=>{ const c=hexRgb(h); return Math.max(...c)-Math.min(...c); };
  const base = a.acc || (sat(a.c[0])>=sat(a.c[1]) ? a.c[0] : a.c[1]);
  const accL = fitColor(base,"#F6EEE9",4.5), accD = fitColor(base,"#150E10",4.5);
  return `--accL:${accL};--accD:${accD};--inkL:${inkOn(accL)};--inkD:${inkOn(accD)}`;
}

/* cores tiradas da capa oficial (no site final, a.cover = URL da capa vinda da API).
   Se a capa não carregar, a página fica com as cores definidas à mão. */
const PALETTE_CACHE = {};
function quantize(data){
  const bins = new Map();
  for(let i=0;i<data.length;i+=4){
    if(data[i+3]<200) continue;
    const r=data[i]>>4, g=data[i+1]>>4, b=data[i+2]>>4, k=(r<<8)|(g<<4)|b;
    const e = bins.get(k) || {n:0,r:0,g:0,b:0}; e.n++; e.r+=data[i]; e.g+=data[i+1]; e.b+=data[i+2]; bins.set(k,e);
  }
  const cols = [...bins.values()].map(e=>{ const c=[e.r/e.n,e.g/e.n,e.b/e.n]; const sat=Math.max(...c)-Math.min(...c); return {c, n:e.n, score:e.n*(0.35+sat/255)}; }).sort((a,b)=>b.score-a.score);
  const picked = [];
  for(const x of cols){ if(picked.every(p=>Math.hypot(p.c[0]-x.c[0],p.c[1]-x.c[1],p.c[2]-x.c[2])>70)) picked.push(x); if(picked.length===3) break; }
  if(!picked.length) return null;
  while(picked.length<3) picked.push(picked[picked.length-1]);
  const accent = picked.slice().sort((a,b)=>(Math.max(...b.c)-Math.min(...b.c))-(Math.max(...a.c)-Math.min(...a.c)))[0];
  return {colors:picked.map(p=>toHex(p.c)), acc:toHex(accent.c)};
}
function paletteFromCover(url){
  if(PALETTE_CACHE[url]!==undefined) return Promise.resolve(PALETTE_CACHE[url]);
  return new Promise(res=>{
    const img = new Image(); img.crossOrigin = "anonymous";
    img.onload = ()=>{ try{ const cv=document.createElement("canvas"); cv.width=cv.height=48; const cx=cv.getContext("2d"); cx.drawImage(img,0,0,48,48); res(PALETTE_CACHE[url]=quantize(cx.getImageData(0,0,48,48).data)); }catch(e){ res(PALETTE_CACHE[url]=null); } };
    img.onerror = ()=>res(PALETTE_CACHE[url]=null);
    img.src = url;
  });
}

/* ---------- utilidades ---------- */
function copyPlain(txt, okMsg){
  const ok = ()=>toast(okMsg);
  const fallback = ()=>{ const ta=document.createElement("textarea"); ta.className="copy"; ta.value=txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); ok(); }catch(e){ toast(t("t_fail")); } ta.remove(); };
  try{ navigator.clipboard.writeText(txt).then(ok).catch(fallback); }catch(e){ fallback(); }
}
function toast(m){ const el=document.createElement("div"); el.className="toast"; el.textContent=m; document.body.appendChild(el); setTimeout(()=>el.remove(),1800); }

/* ---------- duelo genérico ---------- */
let undoStack=[];
let keyHandler=null;
document.addEventListener("keydown", e=>{ if(keyHandler && !e.metaKey && !e.ctrlKey && !e.altKey) keyHandler(e); });

function battleHTML(r, kind, title, eyebrow){
  const a = r.cur, b = opponent(r);
  const L = r.side ? b : a, R = r.side ? a : b;
  const est = estimate(r), pct = Math.round(100*r.comps/((r.comps+est)||1));
  const card = id => kind==="album"
    ? `<div class="fighter" data-pick="${id}">${tile(AL[id],"lg")}<div><h3>${esc(AL[id].t)}</h3><div class="sub">${AL[id].y}</div><div style="margin-top:10px">${wikiLink(AL[id].la)}</div></div>${listen(AL[id].t)}<button class="pick" data-pick="${id}">${esc(t("pick_a"))}</button></div>`
    : `<div class="fighter song-fighter" data-pick="${id}"><div class="row">${tile(AL[SG[id].a])}<div style="min-width:0"><h3>${esc(SG[id].t)}</h3><div class="sub" style="margin-top:4px">${esc(groupName(AL[SG[id].a]))} · ${AL[SG[id].a].y}</div>${songNote(SG[id])}</div></div>${listenSong(SG[id])}<button class="pick" data-pick="${id}">${esc(t("pick_s"))}</button></div>`;
  return `<div class="stage">
    <div class="stage-head"><div><div class="eyebrow">${esc(eyebrow)}</div><h2>${esc(title)}</h2></div>
    <div style="min-width:220px;flex:1;max-width:360px"><div class="progress"><i style="width:${pct}%"></i></div><div class="ptext">${esc(t("duel_n",r.comps+1,est))}</div></div></div>
    <div class="duel">${card(L)}<div class="vs">VS</div>${card(R)}</div>
    <div class="duel-actions"><button class="btn" id="b-undo" ${undoStack.length?"":"disabled"}>${esc(t("undo"))}</button><button class="btn" id="b-tie">${esc(t("tie"))}</button><button class="btn" id="b-quit">${esc(t("quit"))}</button></div>
    <div class="keys">${esc(t("keys"))}</div></div>`;
}
function wireBattle(root, getR, setR, onPick, onQuit){
  const r = getR();
  const L = r.side ? opponent(r) : r.cur;
  const R = L===r.cur ? opponent(r) : r.cur;
  const choose = id => { undoStack.push(JSON.stringify(getR())); const rr=getR(); answer(rr, id===rr.cur); setR(rr); onPick(); };
  root.querySelectorAll("[data-pick]").forEach(el=>el.addEventListener("click", e=>{ e.stopPropagation(); if(e.target.closest("a")) return; choose(el.dataset.pick); }));
  root.querySelector("#b-tie").onclick = ()=>{ undoStack.push(JSON.stringify(getR())); const rr=getR(); answer(rr,false); setR(rr); onPick(); };
  root.querySelector("#b-undo").onclick = ()=>{ if(!undoStack.length) return; setR(JSON.parse(undoStack.pop())); onPick(); };
  root.querySelector("#b-quit").onclick = onQuit;
  keyHandler = e=>{
    if(e.key==="ArrowLeft"){ e.preventDefault(); choose(L); }
    else if(e.key==="ArrowRight"){ e.preventDefault(); choose(R); }
    else if(e.key==="ArrowDown"){ e.preventDefault(); root.querySelector("#b-tie").click(); }
    else if(e.key==="Backspace"){ e.preventDefault(); root.querySelector("#b-undo").click(); }
  };
}

/* ---------- setlist (resultado) ---------- */
function setlistHTML(ids, kind, limit, movable=true){
  const list = ids.slice(0,limit);
  return `<ol class="setlist">${list.map((id,i)=>{
    const a = kind==="album"?AL[id]:AL[SG[id].a];
    const nm = kind==="album"?a.t:SG[id].t;
    const al = kind==="album"?`${a.y}`:`${groupName(a)} · ${a.y}`;
    const mv = movable ? `<div class="mv"><button data-mv="${i}" data-d="-1" aria-label="${esc(t("up"))}" ${i===0?"disabled":""}>↑</button><button data-mv="${i}" data-d="1" aria-label="${esc(t("down"))}" ${i===list.length-1?"disabled":""}>↓</button></div>` : "<div></div>";
    return `<li><div class="pos">${i+1}</div>${tile(a)}<div style="min-width:0"><div class="nm">${esc(nm)}</div><div class="al">${esc(al)}</div></div>${mv}</li>`;
  }).join("")}</ol>`;
}
function wireSetlist(root, arr, rerender){
  root.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.mv, j=i+(+b.dataset.d); [arr[i],arr[j]]=[arr[j],arr[i]]; save(); rerender(); });
}

/* ---------- batalha de álbuns ---------- */
function renderAlbums(){
  const root = document.getElementById("v-albums");
  keyHandler=null;
  if(S.albumResult){
    root.innerHTML = `<div class="stage"><div class="stage-head"><div><div class="eyebrow">${esc(t("ab_res_eb",S.albumComps||0))}</div><h2>${esc(t("ab_res_h"))}</h2></div>
      <div class="duel-actions" style="margin:0"><button class="btn solid" id="a-copy">${esc(t("copy"))}</button><button class="btn" id="a-redo">${esc(t("redo"))}</button></div></div>
      <p class="note" style="margin-bottom:16px">${esc(t("fine"))}</p>${setlistHTML(S.albumResult,"album",13)}</div>`;
    wireSetlist(root, S.albumResult, renderAlbums);
    root.querySelector("#a-copy").onclick=()=>copyPlain(t("copy_alb")+"\n"+S.albumResult.map((id,i)=>`${i+1}. ${AL[id].t} (${AL[id].y})`).join("\n"), t("t_rank"));
    root.querySelector("#a-redo").onclick=()=>{ S.albumResult=null; S.albumRanker=newRanker(ALBUMS.map(a=>a.id),13); undoStack=[]; save(); renderAlbums(); };
    return;
  }
  if(!S.albumRanker){ S.albumRanker = newRanker(ALBUMS.map(a=>a.id),13); undoStack=[]; save(); }
  const r = S.albumRanker;
  if(done(r)){ S.albumResult = r.ranked.slice(); S.albumComps=r.comps; S.albumRanker=null; undoStack=[]; save(); return renderAlbums(); }
  root.innerHTML = battleHTML(r,"album",t("ab_h"),t("ab_eb"));
  wireBattle(root, ()=>S.albumRanker, v=>{S.albumRanker=v; save();}, renderAlbums, ()=>go("home"));
}

/* ---------- batalha de músicas ---------- */
function counts(){ const c={love:0,like:0,meh:0,unk:0}; Object.values(S.ratings).forEach(v=>{ if(v in c) c[v]++; }); return c; }
function pool(){ const love=SONGS.filter(s=>S.ratings[s.id]==="love").map(s=>s.id); const like=SONGS.filter(s=>S.ratings[s.id]==="like").map(s=>s.id); return {love,like}; }

function renderSongs(){
  const root = document.getElementById("v-songs");
  keyHandler=null;
  const st = S.songStage;
  if(st==="setup") return songSetup(root);
  if(st==="triage") return songTriage(root);
  if(st==="pre") return songPre(root);
  if(st==="battle") return songBattle(root);
  if(st==="result") return songResult(root);
}
function songSetup(root){
  const scope = (S.triScope || ALBUMS.map(a=>a.id)).filter(id=>AL[id]);
  const sel = new Set(scope);
  const n = SONGS.filter(s=>sel.has(s.a)).length;
  root.innerHTML = `<div class="stage"><div class="stage-head"><div><div class="eyebrow">${esc(t("s1"))}</div><h2>${esc(t("setup_h"))}</h2></div></div>
    <div class="panel">
      <p>${esc(t("setup_p"))}</p>
      <div><div class="eyebrow" style="margin-bottom:8px">${esc(t("shortcuts"))}</div><div class="chips"><button class="chip" data-q="studio">${esc(t("only_studio"))}</button><button class="chip" data-q="all">${esc(t("all_b"))}</button>${GUITAR.map(g=>`<button class="chip" data-g="${esc(g)}">${esc(t("era",g))}</button>`).join("")}</div></div>
      <div><div class="eyebrow" style="margin-bottom:8px">${esc(t("studio"))}</div><div class="chips">${ALBUMS.map(a=>`<button class="chip" data-al="${a.id}" aria-pressed="${sel.has(a.id)}"><span class="dot" style="background:${a.c[0]}"></span>${esc(a.t)} · ${a.y}</button>`).join("")}</div></div>
      <div><div class="eyebrow" style="margin-bottom:8px">${esc(t("extras_h"))}</div><div class="chips">${EXTRAS.map(x=>`<button class="chip" data-al="${x.id}" aria-pressed="${sel.has(x.id)}"><span class="dot" style="background:${x.c[0]}"></span>${esc(groupName(x))} · ${x.items.length}</button>`).join("")}</div></div>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="btn hot" id="s-start" ${n?"":"disabled"}>${esc(t("start_tri",n))}</button>${Object.keys(S.ratings).length?`<button class="btn" id="s-skip">${esc(t("skip_tri"))}</button>`:""}</div>
    </div></div>`;
  root.querySelectorAll("[data-al]").forEach(b=>b.onclick=()=>{ const id=b.dataset.al; sel.has(id)?sel.delete(id):sel.add(id); S.triScope=[...sel]; save(); songSetup(root); });
  root.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ const g=b.dataset.g; S.triScope = ALL.filter(a=>a.g===g).map(a=>a.id); save(); songSetup(root); });
  root.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{ S.triScope = (b.dataset.q==="all"?ALL:ALBUMS).map(a=>a.id); save(); songSetup(root); });
  root.querySelector("#s-start").onclick=()=>{ S.triOrder = SONGS.filter(s=>sel.has(s.a)).map(s=>s.id); S.triIdx=0; S.songStage="triage"; save(); renderSongs(); };
  const sk=root.querySelector("#s-skip"); if(sk) sk.onclick=()=>{ S.songStage="pre"; save(); renderSongs(); };
}
function songTriage(root){
  const order = (S.triOrder||[]).filter(id=>SG[id]);
  if(S.triIdx>=order.length){ S.songStage="pre"; save(); return renderSongs(); }
  const s = SG[order[S.triIdx]], a = AL[s.a], c = counts();
  const pct = Math.round(100*S.triIdx/order.length);
  const enough = c.love + c.like >= 10;
  root.innerHTML = `<div class="stage"><div class="stage-head"><div><div class="eyebrow">${esc(t("s1"))}</div><h2>${esc(t("tri_h"))}</h2></div>
    <div style="min-width:220px;flex:1;max-width:360px"><div class="progress"><i style="width:${pct}%"></i></div><div class="ptext">${esc(t("tri_prog",S.triIdx+1,order.length,c.love,c.like))}</div></div></div>
    <div class="triage">${tile(a,"lg")}<div style="min-width:0"><div class="eyebrow">${esc(t("track",s.n))} · ${esc(groupName(a))} · ${a.y}</div><h3 style="margin-top:6px">${esc(s.t)}</h3><div class="sub"></div>${s.note?`<div style="margin:-6px 0 12px"><span class="tag">${esc(noteT(s.note))}</span></div>`:""}<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">${listenSong(s)}${a.la?wikiLink(a.la):""}</div>
      <div class="rates"><button class="rate love" data-r="love">${esc(t("love"))}<small>${esc(t("key",1))}</small></button><button class="rate like" data-r="like">${esc(t("like"))}<small>${esc(t("key",2))}</small></button><button class="rate meh" data-r="meh">${esc(t("meh"))}<small>${esc(t("key",3))}</small></button><button class="rate unk" data-r="unk">${esc(t("unk"))}<small>${esc(t("key",4))}</small></button></div></div></div>
    <div class="duel-actions"><button class="btn" id="t-back" ${S.triIdx?"":"disabled"}>${esc(t("back_one"))}</button><button class="btn" id="t-out">${esc(t("quit"))}</button><button class="btn solid" id="t-end" ${enough?"":"disabled"}>${esc(t("end_tri"))}</button></div></div>`;
  const rate = v=>{ S.ratings[s.id]=v; S.triIdx++; save(); songTriage(root); };
  root.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>rate(b.dataset.r));
  root.querySelector("#t-back").onclick=()=>{ if(S.triIdx>0){ S.triIdx--; save(); songTriage(root);} };
  root.querySelector("#t-out").onclick=()=>go("home");
  root.querySelector("#t-end").onclick=()=>{ S.songStage="pre"; save(); renderSongs(); };
  keyHandler = e=>{ const m={"1":"love","2":"like","3":"meh","4":"unk"}[e.key]; if(m){ e.preventDefault(); rate(m); } else if(e.key==="Backspace"){ e.preventDefault(); root.querySelector("#t-back").click(); } };
}
function songPre(root){
  const c = counts(), p = pool();
  const K = S.songK;
  let ids = p.love.slice(), mixed=false;
  if(ids.length < K+5){ ids = ids.concat(p.like); mixed = p.love.length < K+5 && p.like.length>0; }
  const est = ids.length ? estimate({ranked:[],queue:ids.slice(),cur:null,K}) : 0;
  root.innerHTML = `<div class="stage"><div class="stage-head"><div><div class="eyebrow">${esc(t("s2"))}</div><h2>${esc(t("pre_h"))}</h2></div></div>
    <div class="counts"><div class="count"><b style="color:var(--love)">${c.love}</b><span>${esc(t("love"))}</span></div><div class="count"><b style="color:var(--like)">${c.like}</b><span>${esc(t("like"))}</span></div><div class="count"><b style="color:var(--meh)">${c.meh}</b><span>${esc(t("meh"))}</span></div><div class="count"><b style="color:var(--unk)">${c.unk}</b><span>${esc(t("unk"))}</span></div></div>
    <div class="panel">
      <div><div class="eyebrow" style="margin-bottom:8px">${esc(t("size"))}</div><div class="seg"><button data-k="10" aria-pressed="${K===10}">Top 10</button><button data-k="20" aria-pressed="${K===20}">Top 20</button></div></div>
      <p>${esc(ids.length < 2 ? t("pre_need") : t("pre_msg",ids.length,K,mixed,est))}</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn hot" id="p-go" ${ids.length<2?"disabled":""}>${esc(t("pre_go"))}</button><button class="btn" id="p-tri">${esc(t("pre_back"))}</button></div>
    </div></div>`;
  root.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ S.songK=+b.dataset.k; save(); songPre(root); });
  root.querySelector("#p-go").onclick=()=>{ S.songRanker=newRanker(ids, Math.min(K, ids.length)); S.songRankerK=K; undoStack=[]; S.songStage="battle"; save(); renderSongs(); };
  root.querySelector("#p-tri").onclick=()=>{ S.songStage = (S.triOrder && S.triIdx<S.triOrder.length) ? "triage" : "setup"; save(); renderSongs(); };
}
function songBattle(root){
  const r = S.songRanker;
  if(!r){ S.songStage="pre"; save(); return renderSongs(); }
  if(done(r)){ S.songResult=r.ranked.slice(); S.songResultK=S.songRankerK; S.songComps=r.comps; S.songView=Math.min(S.songRankerK, r.ranked.length); S.songRanker=null; undoStack=[]; S.songStage="result"; save(); return renderSongs(); }
  root.innerHTML = battleHTML(r,"song",t("sb_h",S.songRankerK),t("s2"));
  wireBattle(root, ()=>S.songRanker, v=>{S.songRanker=v; save();}, ()=>songBattle(root), ()=>go("home"));
}
function songResult(root){
  const res = S.songResult||[], max = res.length, view = Math.min(S.songView||10, max);
  root.innerHTML = `<div class="stage"><div class="stage-head"><div><div class="eyebrow">${esc(t("res_eb",S.songComps||0))}</div><h2>${esc(t("res_h"))}</h2></div>
    <div class="seg"><button data-v="10" aria-pressed="${view<=10}">Top 10</button><button data-v="20" aria-pressed="${view>10}" ${max>10?"":"disabled"}>Top 20</button></div></div>
    <p class="note" style="margin-bottom:16px">${esc(max<=10 && S.songResultK!==20 ? t("need20") : t("fine"))}</p>
    ${setlistHTML(res,"song",view)}
    <div class="duel-actions"><button class="btn solid" id="r-copy">${esc(t("copy"))}</button><button class="btn" id="r-again">${esc(t("redo_duels"))}</button><button class="btn" id="r-tri">${esc(t("redo_tri"))}</button></div></div>`;
  root.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{ S.songView=+b.dataset.v; save(); songResult(root); });
  wireSetlist(root, S.songResult, ()=>songResult(root));
  root.querySelector("#r-copy").onclick=()=>copyPlain(t("copy_song",view)+"\n"+res.slice(0,view).map((id,i)=>`${i+1}. ${SG[id].t} (${groupName(AL[SG[id].a])})`).join("\n"), t("t_rank"));
  root.querySelector("#r-again").onclick=()=>{ S.songStage="pre"; save(); renderSongs(); };
  root.querySelector("#r-tri").onclick=()=>{ S.ratings={}; S.triIdx=0; S.triOrder=null; S.songStage="setup"; save(); renderSongs(); };
}

/* ---------- meus rankings ---------- */
function renderMine(){
  const root = document.getElementById("v-mine"); keyHandler=null;
  const albums = S.albumResult ? setlistHTML(S.albumResult,"album",13,false) : `<div class="empty">${esc(t("empty_alb"))} <button class="btn hot" data-go="albums" style="margin-left:8px">${esc(t("do_now"))}</button></div>`;
  const view = Math.min(S.songView||10, (S.songResult||[]).length);
  const songs = S.songResult ? setlistHTML(S.songResult,"song",view,false) : `<div class="empty">${esc(t("empty_song"))} <button class="btn hot" data-go="songs" style="margin-left:8px">${esc(t("begin"))}</button></div>`;
  root.innerHTML = `<div class="stage"><div class="section-title" style="margin-top:0"><h2>${esc(t("m_albums"))}</h2></div>${albums}
    <div class="section-title"><h2>${esc(t("m_songs"))}${S.songResult?` · Top ${view}`:""}</h2></div>${songs}
    <div class="duel-actions" style="margin-top:32px"><button class="btn" id="m-reset">${esc(t("reset"))}</button></div></div>`;
  const rs = root.querySelector("#m-reset");
  rs.onclick=()=>{ if(rs.dataset.armed){ try{localStorage.removeItem(KEY)}catch(e){} location.reload(); } else { rs.dataset.armed="1"; rs.textContent=t("reset_ok"); rs.classList.add("hot"); } };
}

applyChrome();
go("home");
